<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Abyssal Treasure</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --water-surface: #6dd4dc;
            --water-mid: #1a7a8a;
            --water-deep: #052435;
            --water-abyss: #020c14;
            --floor: #1a1814;

            --coral-pink: #ff7a9c;
            --coral-deep: #c8344c;
            --coral-peach: #ffb074;
            --coral-purple: #d670c5;
            --coral-red: #d63a4a;
            --coral-soft: #f8a8c0;

            --wood-dark: #2a1408;
            --wood-mid: #5c2e15;
            --wood-light: #8a4a25;
            --wood-highlight: #a86a35;
            --gold: #c89a3a;
            --gold-mid: #e8b850;
            --gold-bright: #ffd966;
            --gold-glow: #ffe9a8;

            --pearl: #fff8e7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Cormorant Garamond', serif;
            color: var(--pearl);
            cursor: default
        }

        /* ===== OCEAN SCENE ===== */
        .ocean {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(ellipse 80% 60% at 50% 0%, rgba(180, 235, 250, 0.85) 0%, transparent 60%),
                linear-gradient(180deg,
                    #6dd4dc 0%,
                    #4fb5c4 10%,
                    #2d8a9e 22%,
                    #1a6d82 36%,
                    #0e4860 50%,
                    #072d3e 66%,
                    #041824 82%,
                    #020c14 100%);
        }

        /* surface shimmer */
        .surface {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 90px;
            background:
                linear-gradient(180deg, rgba(220, 250, 255, 0.6) 0%, rgba(160, 230, 245, 0.25) 50%, transparent 100%);
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: screen;
        }

        .surface::before,
        .surface::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: repeating-linear-gradient(90deg,
                    transparent 0px, transparent 18px,
                    rgba(255, 255, 255, 0.35) 18px, rgba(255, 255, 255, 0.35) 22px,
                    transparent 22px, transparent 40px,
                    rgba(255, 255, 255, 0.2) 40px, rgba(255, 255, 255, 0.2) 44px);
            filter: blur(2px);
            animation: shimmerShift 9s linear infinite;
        }

        .surface::after {
            top: 25px;
            opacity: 0.5;
            animation-duration: 14s;
            animation-direction: reverse
        }

        @keyframes shimmerShift {
            from {
                transform: translateX(0)
            }

            to {
                transform: translateX(80px)
            }
        }

        /* god rays */
        .rays {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            overflow: hidden
        }

        .ray {
            position: absolute;
            top: -10%;
            width: 260px;
            height: 130%;
            background: linear-gradient(180deg,
                    rgba(200, 240, 250, 0.22) 0%,
                    rgba(170, 225, 240, 0.12) 35%,
                    rgba(150, 210, 230, 0.04) 65%,
                    transparent 100%);
            transform-origin: top center;
            filter: blur(14px);
            transform: rotate(8deg);
            animation: raySway 11s ease-in-out infinite alternate;
            mix-blend-mode: screen;
        }

        .ray:nth-child(1) {
            left: -5%;
            width: 200px;
            animation-delay: 0s
        }

        .ray:nth-child(2) {
            left: 15%;
            width: 280px;
            animation-delay: -2s;
            transform: rotate(-6deg)
        }

        .ray:nth-child(3) {
            left: 38%;
            width: 240px;
            animation-delay: -4s;
            transform: rotate(4deg)
        }

        .ray:nth-child(4) {
            left: 58%;
            width: 300px;
            animation-delay: -6s;
            transform: rotate(-8deg)
        }

        .ray:nth-child(5) {
            left: 80%;
            width: 220px;
            animation-delay: -8s;
            transform: rotate(6deg)
        }

        @keyframes raySway {
            0% {
                opacity: 0.6;
                transform: rotate(8deg) translateX(0)
            }

            100% {
                opacity: 1;
                transform: rotate(2deg) translateX(30px)
            }
        }

        /* floor */
        .floor {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 24%;
            background:
                radial-gradient(ellipse 60% 80% at 50% 100%, rgba(60, 40, 30, 0.6) 0%, transparent 60%),
                linear-gradient(180deg, transparent 0%, rgba(15, 10, 6, 0.5) 40%, #1a1814 100%);
            z-index: 5;
        }

        .floor::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 60%, rgba(120, 90, 60, 0.3) 0%, transparent 8%),
                radial-gradient(circle at 35% 80%, rgba(80, 60, 40, 0.4) 0%, transparent 6%),
                radial-gradient(circle at 65% 70%, rgba(100, 80, 50, 0.3) 0%, transparent 7%),
                radial-gradient(circle at 85% 85%, rgba(90, 70, 45, 0.35) 0%, transparent 5%);
        }

        /* caustic light pattern on floor */
        .caustics {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 24%;
            z-index: 6;
            pointer-events: none;
            opacity: 0.5;
            mix-blend-mode: screen;
            background-image:
                radial-gradient(ellipse 60px 12px at 20% 70%, rgba(200, 240, 250, 0.6), transparent),
                radial-gradient(ellipse 80px 14px at 40% 85%, rgba(200, 240, 250, 0.5), transparent),
                radial-gradient(ellipse 50px 10px at 70% 75%, rgba(200, 240, 250, 0.5), transparent),
                radial-gradient(ellipse 70px 12px at 90% 90%, rgba(200, 240, 250, 0.4), transparent);
            filter: blur(3px);
            animation: causticMove 14s ease-in-out infinite alternate;
        }

        @keyframes causticMove {
            0% {
                transform: translateX(-20px) scale(1);
                opacity: 0.4
            }

            100% {
                transform: translateX(20px) scale(1.05);
                opacity: 0.7
            }
        }

        /* ===== CORALS LAYER ===== */
        .coral-layer {
            position: absolute;
            inset: 0;
            z-index: 7;
            pointer-events: none
        }

        .coral {
            position: absolute;
            bottom: 0;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.4));
            transform-origin: bottom center;
            animation: sway 6s ease-in-out infinite alternate;
        }

        @keyframes sway {
            0% {
                transform: rotate(-1.5deg)
            }

            100% {
                transform: rotate(1.5deg)
            }
        }

        /* ===== FISH ===== */
        .fish-layer {
            position: absolute;
            inset: 0;
            z-index: 8;
            pointer-events: none;
            overflow: hidden
        }

        .fish {
            position: absolute;
            animation: swim 22s linear infinite;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .fish .reverse {
            animation: swimRev 26s linear infinite
        }

        @keyframes swim {
            0% {
                transform: translateX(-200px) translateY(0)
            }

            50% {
                transform: translateX(50vw) translateY(-20px)
            }

            100% {
                transform: translateX(110vw) translateY(10px)
            }
        }

        @keyframes swimRev {
            0% {
                transform: translateX(110vw) translateY(0) scaleX(-1)
            }

            50% {
                transform: translateX(50vw) translateY(-30px) scaleX(-1)
            }

            100% {
                transform: translateX(-200px) translateY(15px) scaleX(-1)
            }
        }

        .fish-body {
            animation: fishWiggle 0.6s ease-in-out infinite alternate;
            display: block
        }

        @keyframes fishWiggle {
            0% {
                transform: skewY(-3deg)
            }

            100% {
                transform: skewY(3deg)
            }
        }

        /* ===== BUBBLES ===== */
        .bubbles {
            position: absolute;
            inset: 0;
            z-index: 9;
            pointer-events: none;
            overflow: hidden
        }

        .bubble {
            position: absolute;
            bottom: -30px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,
                    rgba(255, 255, 255, 0.9) 0%,
                    rgba(200, 240, 250, 0.5) 40%,
                    rgba(150, 210, 230, 0.2) 70%,
                    transparent 100%);
            box-shadow: inset 0 0 6px rgba(255, 255, 255, 0.4);
            animation: rise linear infinite;
        }

        @keyframes rise {
            0% {
                transform: translate(0, 0) scale(0.5);
                opacity: 0
            }

            10% {
                opacity: 0.8
            }

            50% {
                transform: translate(20px, -50vh) scale(1)
            }

            100% {
                transform: translate(-10px, -110vh) scale(1.1);
                opacity: 0
            }
        }

        /* ===== PLANKTON / DUST ===== */
        .plankton {
            position: absolute;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            overflow: hidden
        }

        .dot {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 250, 200, 0.9), rgba(255, 220, 150, 0.2));
            box-shadow: 0 0 6px rgba(255, 240, 180, 0.6);
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0);
                opacity: 0
            }

            20% {
                opacity: 1
            }

            80% {
                opacity: 1
            }

            100% {
                transform: translate(40px, -80px);
                opacity: 0
            }
        }

        /* ===== TITLE ===== */
        .title {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 20;
            pointer-events: none;
        }

        .title h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(28px, 4vw, 52px);
            font-weight: 800;
            letter-spacing: 0.15em;
            background: linear-gradient(180deg, #fff 0%, #b8e8f0 50%, #5fa8b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(120, 200, 220, 0.4);
            margin-bottom: 8px;
        }

        .title p {
            font-size: 14px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: rgba(200, 230, 240, 0.7);
            font-weight: 300;
        }

        .title .ornament {
            width: 120px;
            height: 1px;
            margin: 12px auto;
            background: linear-gradient(90deg, transparent, rgba(200, 230, 240, 0.6), transparent);
        }

        /* ===== CHEST ===== */
        .chest-container {
            position: absolute;
            left: 50%;
            bottom: 14%;
            transform: translateX(-50%);
            z-index: 12;
            perspective: 1200px;
            cursor: pointer;
        }

        .chest-glow-ambient {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 340px;
            height: 340px;
            border-radius: 50%;
            background: radial-gradient(circle,
                    rgba(255, 220, 140, 0.18) 0%,
                    rgba(255, 200, 120, 0.08) 40%,
                    transparent 70%);
            filter: blur(20px);
            animation: pulseGlow 3 s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0% {
                opacity: 0.5;
                transform: translateX(-50%) scale(0.9)
            }

            100% {
                opacity: 0.9;
                transform: translateX(-50%) scale(1.1)
            }
        }

        .chest {
            position: relative;
            width: 260px;
            height: 170px;
            transform-style: preserve-3d;
            transform: rotateX(8deg);
            transition: transform 0.4s ease;
        }

        .chest-container:hover .chest {
            transform: rotateX(8deg) translateY(-6px)
        }

        .chest-shadow {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 30px;
            background: radial-gradient(ellipse, rgba(0, 0, 0, 0.55) 0%, transparent 70%);
            filter: blur(8px);
        }

        /* treasure glow inside */
        .treasure-glow {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 200px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(ellipse,
                    rgba(255, 230, 150, 0.95) 0%,
                    rgba(255, 210, 100, 0.7) 30%,
                    rgba(255, 180, 60, 0.3) 60%,
                    transparent 100%);
            filter: blur(8px);
            opacity: 0;
            transition: opacity 0.4s ease 0.3s, transform 0.5s ease 0.3s;
            transform: scale(0.3);
            pointer-events: none;
            z-index: 1;
        }

        .chest.opened .treasure-glow {
            opacity: 1;
            transform: scale(1.3);
        }

        /* treasure items inside chest */
        .treasure-pile {
            position: absolute;
            top: 35px;
            left: 25px;
            width: 210px;
            height: 70px;
            z-index: 2;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease 0.4s, transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s;
        }

        .chest.opened .treasure-pile {
            opacity: 1;
            transform: translateY(0);
        }

        .coin {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%,
                    #fff5d0 0%, #ffd966 30%, #d4a020 70%, #8a6010 100%);
            box-shadow: 0 0 8px rgba(255, 210, 100, 0.8),
                inset -2px -2px 3px rgba(120, 80, 10, 0.4),
                inset 2px 2px 3px rgba(255, 250, 200, 0.6);
        }

        .coin::after {
            content: "";
            position: absolute;
            inset: 15%;
            border: 1px solid rgba(120, 80, 10, 0.5);
            border-radius: 50%;
        }

        .gem {
            position: absolute;
            width: 18px;
            height: 22px;
            clip-path: polygon(50% 0%, 100% 35%, 80% 100%, 20% 100%, 0% 35%);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.5);
        }

        .gem.red {
            background: linear-gradient(135deg, #ff8a8a 0%, #d63a4a 50%, #7a1020 100%)
        }

        .gem.blue {
            background: linear-gradient(135deg, #8ae0ff 0%, #3a8ad6 50%, #103a7a 100%)
        }

        .gem.green {
            background: linear-gradient(135deg, #a0ffa0 0%, #3ad680 50%, #107a3a 100%)
        }

        .gem.purple {
            background: linear-gradient(135deg, #e8a0ff 0%, #a040d6 50%, #3a107a 100%)
        }

        /* CHEST BODY */
        .chest-body {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 260px;
            height: 120px;
            transform-style: preserve-3d;
            z-index: 3;
        }

        .body-front {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg,
                    rgba(255, 180, 100, 0.15) 0%,
                    transparent 20%,
                    transparent 70%,
                    rgba(0, 0, 0, 0.3) 100%),
                repeating-linear-gradient(180deg,
                    transparent 0px, transparent 28px,
                    rgba(0, 0, 0, 0.25) 28px, rgba(0, 0, 0, 0.25) 30px,
                    transparent 30px, transparent 58px,
                    rgba(0, 0, 0, 0.2) 58px, rgba(0, 0, 0, 0.2) 60px),
                linear-gradient(180deg, #7a4525 0%, #5c2e15 50%, #3a1a0c 100%);
            border-radius: 6px;
            box-shadow:
                inset 0 6px 8px rgba(255, 180, 100, 0.2),
                inset 0 -8px 12px rgba(0, 0, 0, 0.4),
                inset 4px 0 6px rgba(0, 0, 0, 0.3),
                inset -4px 0 6px rgba(0, 0, 0, 0.3),
                0 6px 20px rgba(0, 0, 0, 0.5);
        }

        /* gold bands */
        .gold-band {
            position: absolute;
            left: 0;
            right: 0;
            height: 10px;
            background: linear-gradient(180deg,
                    #ffe9a8 0%, #ffd966 25%, #c89a3a 60%, #8a6010 100%);
            box-shadow:
                inset 0 1px 2px rgba(255, 250, 200, 0.8),
                inset 0 -2px 3px rgba(80, 50, 0, 0.6),
                0 1px 4px rgba(0, 0, 0, 0.4);
        }

        .gold-band::before {
            content: "";
            position: absolute;
            inset: 2px 4px;
            background: repeating-linear-gradient(90deg,
                    transparent 0px, transparent 6px,
                    rgba(120, 80, 10, 0.3) 6px, rgba(120, 80, 10, 0.3) 7px);
        }

        .band-top {
            top: 8px
        }

        .band-bottom {
            bottom: 8px
        }

        /* gold corners */
        .gold-corner {
            position: absolute;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #ffe9a8 0%, #ffd966 30%, #c89a3a 70%, #8a6010 100%);
            box-shadow: inset 1px 1px 2px rgba(255, 250, 200, 0.7), inset -1px -1px 2px rgba(80, 50, 0, 0.6);
            border-radius: 4px;
        }

        .gold-corner.tl {
            top: 4px;
            left: 4px
        }

        .gold-corner.tr {
            top: 4px;
            right: 4px
        }

        .gold-corner.bl {
            bottom: 4px;
            left: 4px
        }

        .gold-corner.br {
            bottom: 4px;
            right: 4px
        }

        .gold-corner::before {
            content: "";
            position: absolute;
            inset: 30%;
            border-radius: 50%;
            background: radial-gradient(circle, #ffd966, #8a6010);
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
        }

        /* lock */
        .lock {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 42px;
            height: 50px;
            background: linear-gradient(180deg, #ffe9a8 0%, #ffd966 30%, #c89a3a 70%, #6a4008 100%);
            border-radius: 8px 8px 6px 6px;
            box-shadow:
                inset 0 2px 3px rgba(255, 250, 200, 0.8),
                inset 0 -3px 4px rgba(80, 50, 0, 0.6),
                0 0 12px rgba(255, 210, 100, 0.5),
                0 2px 6px rgba(0, 0, 0, 0.5);
            transition: transform 0.4s ease, opacity 0.4s ease;
            z-index: 4;
        }

        .lock::before {
            content: "";
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 14px;
            border: 3px solid #6a4008;
            border-bottom: none;
            border-radius: 9px 9px 0 0;
            background: transparent;
        }

        .lock-keyhole {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 18px;
            background: #3a2008;
            border-radius: 5px 5px 3px 3px;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        .lock-keyhole::after {
            content: "";
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 8px;
            background: #3a2008;
            border-radius: 0 0 50% 50%;
        }

        .chest.opened .lock {
            transform: translate(-50%, -50%) translateY(180px) rotate(45deg);
            opacity: 0;
        }

        /* CHEST LID */
        .chest-lid {
            position: absolute;
            top: 0;
            left: 0;
            width: 260px;
            height: 55px;
            transform-origin: bottom center;
            transform: rotateX(0deg);
            transform-style: preserve-3d;
            transition: transform 0.9s cubic-bezier(0.34, 1.4, 0.5, 1);
            z-index: 5;
        }

        .chest.opened .chest-lid {
            transform: rotateX(-118deg);
        }

        .lid-top {
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg,
                    rgba(255, 180, 100, 0.2) 0%,
                    transparent 30%,
                    transparent 60%,
                    rgba(0, 0, 0, 0.4) 100%),
                repeating-linear-gradient(180deg,
                    transparent 0px, transparent 18px,
                    rgba(0, 0, 0, 0.25) 18px, rgba(0, 0, 0, 0.25) 20px),
                linear-gradient(180deg, #8a4a25 0%, #5c2e15 60%, #3a1a0c 100%);
            border-radius: 10px 10px 4px 4px;
            box-shadow:
                inset 0 4px 6px rgba(255, 180, 100, 0.3),
                inset 0 -4px 6px rgba(0, 0, 0, 0.4),
                0 4px 12px rgba(0, 0, 0, 0.5);
        }

        .lid-band {
            position: absolute;
            top: 14px;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(180deg, #ffe9a8 0%, #ffd966 30%, #c89a3a 70%, #6a4008 100%);
            box-shadow: inset 0 1px 2px rgba(255, 250, 200, 0.8), inset 0 -2px 3px rgba(80, 50, 0, 0.6);
        }

        .lid-corner {
            position: absolute;
            top: 4px;
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #ffe9a8 0%, #ffd966 30%, #c89a3a 70%, #6a4008 100%);
            border-radius: 3px;
            box-shadow: inset 1px 1px 2px rgba(255, 250, 200, 0.7);
        }

        .lid-corner.tl {
            left: 4px
        }

        .lid-corner.tr {
            right: 4px
        }

        .lid-arch-front {
            position: absolute;
            bottom: -3px;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(180deg, #5c2e15 0%, #2a1408 100%);
            border-radius: 0 0 4px 4px;
            box-shadow: inset 0 -2px 4px rgba(0, 0, 0, 0.5);
        }

        /* hint */
        .hint {
            position: absolute;
            left: 50%;
            bottom: -40px;
            transform: translateX(-50%);
            font -family: 'Cinzel', serif;
            font-size: 12px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255, 230, 150, 0.8);
            text-shadow: 0 0 12px rgba(255, 200, 100, 0.6);
            white-space: nowrap;
            animation: hintPulse 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes hintPulse {

            0%,
            100% {
                opacity: 0.6;
                transform: translateX(-50%) translateY(0)
            }

            50% {
                opacity: 1;
                transform: translateX(-50%) translateY(-3px)
            }
        }

        .chest-container.opened-state .hint {
            opacity: 0;
            transition: opacity 0.5s
        }

        /* light burst when opening */
        .light-burst {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle,
                    rgba(255, 250, 200, 0.8) 0%,
                    rgba(255, 220, 120, 0.4) 20%,
                    rgba(255, 180, 60, 0.15) 50%,
                    transparent 80%);
            pointer-events: none;
            z-index: 11;
            opacity: 0;
        }

        .light-burst.active {
            animation: burst 1.4s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
        }

        @keyframes burst {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0
            }

            20% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.6)
            }

            100% {
                transform: translate(-50%, -50%) scale(2.5);
                opacity: 0
            }
        }

        /* gold particles flying out */
        .gold-particle {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff5d0 0%, #ffd966 50%, #c89a3a 100%);
            box-shadow: 0 0 8px rgba(255, 210, 100, 0.9);
            pointer-events: none;
            z-index: 13;
        }

        /* light beam from opened chest */

        .treasure-beam {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%) scaleY(0);
            transform-origin: bottom center;
            width: 180px;
            height: 100vh;
            background: linear-gradient(180deg,
                    rgba(255, 230, 150, 0) 0%,
                    rgba(255, 220, 120, 0.15) 30%,
                    rgba(255, 200, 80, 0.3) 70%,
                    rgba(255, 230, 150, 0.6) 100%);
            filter: blur(15px);
            mix-blend-mode: screen;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.6s ease 0.3s, transform 0.8s cubic-bezier(0.2, 0.8, 0.3, 1) 0.3s;
        }

        .chest-container.opened-state .treasure-beam {
            opacity: 1;
            transform: translateX(-50%) scaleY(1);
        }

        /* footer hint */
        .credits {
            position: absolute;
            bottom: 14px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: rgba(200, 230, 240, 0.4);
            z-index: 20;
            pointer-events: none;
            font-family: 'Cinzel', serif;
        }
    </style>

            <svg class="fish"
                style="top:25%;left:30%;width:60px;height:80px;animation-duration:45s;animation-delay:-10s"
                viewBox="0 0 60 80">
                <defs>
                    <radialGradient id="jellyGrad" cx="0.5" cy="0.3" r="0.6">
                        <stop offset="0" stop-color="#ffe0f0" stop-opacity="0.9" />
                        <stop offset="0.6" stop-color="#ff90c8" stop-opacity="0.6" />
                        <stop offset="1" stop-color="#c830a0" stop-opacity="0.3" />
                    </radialGradient>
                </defs>
                <g class="fish-body" style="animation-name:fishWiggle;animation-duration:2s">
                    <path
                        d="M10,30 Q5,15 30,8 Q55,15 50,30 Q50,38 45,35 Q40,32 35,35 Q30,38 25,35 Q20,32 15,35 Q10,38 10,30 Z"
                        fill="url(#jellyGrad)" />
                    <path d="M15,38 Q14,50 16,70 M25,38 Q24,55 26,75 M35,38 Q36,55 34,75 M45,38 Q46,50 44,70"
                        stroke="#ff90c8" stroke-width="1.5" fill="none" opacity="0.6" />
                    <ellipse cx="25" cy="22" rx="3" ry="2" fill="#fff" opacity="0.7" />
                    <ellipse cx="35" cy="22" rx="3" ry="2" fill="#fff" opacity="0.7" />
                </g>
            </svg>
        </div>

        <!-- BUBBLES -->
        <div class="bubbles" id="bubbles"></div>

        <!-- TITLE -->
        <div class="title">
            <h1>The Abyssal Treasure</h1>
            <div class="ornament"></div>
            <p>Beneath the Coral Veil</p>
        </div>

        <!-- TREASURE BEAM (revealed on open) -->
        <div class="treasure-beam" id="beam"></div>

        <!-- CHEST -->
        <div class="chest-container" id="chestContainer">

            <div class="light-burst" id="burst"></div>

            <div class="chest-glow-ambient"></div>

            <div class="chest" id="chest">

                <div class="chest-shadow"></div>

                <div class="treasure-glow"></div>

                <div class="treasure-pile">
                    <!-- coins -->
                    <div class="coin" style="left:20px;bottom:5px;width:22px;height:22px"></div>
                    <div class="coin" style="left:45px;bottom:8px;width:20px;height:20px"></div>
                    <div class="coin" style="left:70px;bottom:4px;width:24px;height:24px"></div>
                    <div class="coin" style="left:95px;bottom:9px;width:21px;height:21px"></div>
                    <div class="coin" style="left:120px;bottom:5px;width:23px;height:23px"></div>
                    <div class="coin" style="left:145px;bottom:8px;width:20px;height:20px"></div>
                    <div class="coin" style="left:170px;bottom:4px;width:22px;height:22px"></div>
                    <div class="coin" style="left:32px;bottom:24px;width:22px;height:22px"></div>
                    <div class="coin" style="left:58px;bottom:28px;width:20px;height:20px"></div>
                    <div class="coin" style="left:85px;bottom:26px;width:23px;height:23px"></div>

                    <div class="coin" style="left:162px;bottom:28px;width:20px;height:20px"></div>
                    <div class="coin" style="left:50px;bottom:48px;width:20px;height:20px"></div>
                    <div class="coin" style="left:75px;bottom:50px;width:22px;height:22px"></div>
                    <div class="coin" style="left:100px;bottom:48px;width:21px;height:21px"></div>
                    <div class="coin" style="left:125px;bottom:50px;width:20px;height:20px"></div>
                    <div class="coin" style="left:150px;bottom:48px;width:22px;height:22px"></div>

                    <!-- gems -->
                    <div class="gem red" style="left:40px;bottom:54px"></div>
                    <div class="gem blue" style="left:80px;bottom:60px"></div>
                    <div class="gem green" style="left:120px;bottom:54px"></div>
                    <div class="gem purple" style="left:160px;bottom:58px"></div>
                    <div class="gem red" style="left:65px;bottom:72px;width:14px;height:18px"></div>

    </div>

    <script>
        // ===== Bubbles generation =====
        const bubbleContainer = document.getElementById('bubbles');
        const bubbleCount = 28;
        for (let i = 0; i < bubbleCount; i++) {
            const b = document.createElement('div');
            b.className = 'bubble';
            const size = Math.random() * 16 + 4;
            b.style.width = size + 'px';
            b.style.height = size + 'px';
            b.style.left = (Math.random() * 100) + '%';
            b.style.animationDuration = (Math.random() * 10 + 8) + 's';
            b.style.animationDelay = (Math.random() * -15) + 's';
            b.style.opacity = Math.random() * 0.5 + 0.3;
            bubbleContainer.appendChild(b);
        }

        // ===== Plankton dust =====
        const plankton = document.getElementById('plankton');
        const dotCount = 45;
        for (let i = 0; i < dotCount; i++) {
            const d = document.createElement('div');
            d.className = 'dot';
            d.style.left = (Math.random() * 100) + '%';
            d.style.top = (Math.random() * 100) + '%';
            d.style.animationDuration = (Math.random() * 12 + 8) + 's';
            d.style.animationDelay = (Math.random() * -15) + 's';
            d.style.opacity = Math.random() * 0.7 + 0.3;
            const s = Math.random() * 2 + 1;
            d.style.width = s + 'px';
            d.style.height = s + 'px';
            plankton.appendChild(d);
        }

        // ===== Chest open interaction =====
        const chestContainer = document.getElementById('chestContainer');
        const chest = document.getElementById('chest');
        const burst = document.getElementById('burst');

        let opened = false;

        function openChest() {
            if (opened) return;
            opened = true;
            chest.classList.add('opened');
            chestContainer.classList.add('opened-state');
            burst.classList.add('active');

            // Emit gold particles
            const rect = chestContainer.getBoundingClientRect();
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'gold-particle';
                const startX = rect.left + rect.width / 2;
                const startY = rect.top + rect.height * 0.4;
                p.style.left = startX + 'px';
                p.style.top = startY + 'px';
                p.style.position = 'fixed';
                p.style.zIndex = 50;
                document.body.appendChild(p);

                const angle = (Math.random() * Math.PI - Math.PI / 2);
                const distance = Math.random() * 180 + 80;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance - Math.random() * 100;
                const dur = Math.random() * 800 + 1000;

                p.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0.3)`, opacity: 0 }
                ], { duration: dur, easing: 'cubic-bezier(0.2,0.6,0.4,1)' });

                setTimeout(() => p.remove(), dur);
            }

            // Reset burst after animation
            setTimeout(() => {
                burst.classList.remove('active');
            }, 1500);
        }

        chestContainer.addEventListener('click', openChest);
        chestContainer.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openChest(); }
        });
        chestContainer.setAttribute('tabindex', '0');
        chestContainer.setAttribute('role', 'button');
        chestContainer.setAttribute('aria-label', 'Open the treasure chest');
    </script>

</body>
